plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ankit.greedling'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/greedling-stable.jks')
            storePassword 'greedling'
            keyAlias 'greedling'
            keyPassword 'greedling'
        }
    }

    defaultConfig {
        applicationId 'com.ankit.greedling.game'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.1.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
