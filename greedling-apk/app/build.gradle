plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ankit.greedling'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ankit.greedling.game'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.1.2'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
