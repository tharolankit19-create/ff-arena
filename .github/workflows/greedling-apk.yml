name: Build GREEDLING APK

on:
  push:
    branches: [greedling-apk-build]
    paths:
      - 'greedling-apk/**'
      - '.github/workflows/greedling-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble offline GREEDLING web payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/greedling-web
          mkdir -p /tmp/greedling-web greedling-apk/app/src/main/assets
          cp greedling-apk/game-src/index.html /tmp/greedling-web/
          cp greedling-apk/game-src/styles.css /tmp/greedling-web/
          cp greedling-apk/game-src/catalog.mjs /tmp/greedling-web/
          cp greedling-apk/game-src/game.mjs /tmp/greedling-web/

          # Three.js r180 is split into three.module.js + three.core.js.
          # Missing three.core.js caused the Start button to look clickable while game.mjs never executed.
          curl -fsSL --retry 3 "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" -o /tmp/greedling-web/three.module.js || \
            curl -fsSL --retry 3 "https://unpkg.com/three@0.180.0/build/three.module.js" -o /tmp/greedling-web/three.module.js
          curl -fsSL --retry 3 "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.core.js" -o /tmp/greedling-web/three.core.js || \
            curl -fsSL --retry 3 "https://unpkg.com/three@0.180.0/build/three.core.js" -o /tmp/greedling-web/three.core.js
          test -s /tmp/greedling-web/three.module.js
          test -s /tmp/greedling-web/three.core.js
          grep -q "./three.core.js" /tmp/greedling-web/three.module.js

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/greedling-web/game.mjs')
          s = p.read_text()
          fixes = {
              "meta.owned.disguise?.75:1": "meta.owned.disguise ? .75 : 1",
              "lead?.7:1": "lead ? .7 : 1",
              "mods.has('stable')?.75:1": "mods.has('stable') ? .75 : 1",
              "lead?.2:1": "lead ? .2 : 1",
          }
          for a,b in fixes.items():
              s = s.replace(a,b)
          p.write_text(s)
          PY

          node --check /tmp/greedling-web/game.mjs
          node --check /tmp/greedling-web/catalog.mjs
          node --check /tmp/greedling-web/three.module.js
          node --check /tmp/greedling-web/three.core.js
          grep -q 'src="./game.mjs"' /tmp/greedling-web/index.html
          grep -q "from './three.module.js'" /tmp/greedling-web/game.mjs
          grep -q "startBtn" /tmp/greedling-web/game.mjs

          (cd /tmp/greedling-web && zip -9 -q -r "$GITHUB_WORKSPACE/greedling-apk/app/src/main/assets/game.zip" .)
          unzip -t greedling-apk/app/src/main/assets/game.zip
          unzip -l greedling-apk/app/src/main/assets/game.zip | grep -q three.module.js
          unzip -l greedling-apk/app/src/main/assets/game.zip | grep -q three.core.js

      - name: Build debug APK
        working-directory: greedling-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and bundled game
        shell: bash
        run: |
          set -euxo pipefail
          APK="greedling-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/game.zip > /tmp/final-game.zip
          unzip -t /tmp/final-game.zip
          unzip -l /tmp/final-game.zip | grep -q three.module.js
          unzip -l /tmp/final-game.zip | grep -q three.core.js
          unzip -l /tmp/final-game.zip | grep -q game.mjs
          unzip -p /tmp/final-game.zip three.module.js | grep -q "./three.core.js"
          unzip -p /tmp/final-game.zip index.html | grep -q 'src="./game.mjs"'
          unzip -p /tmp/final-game.zip game.mjs > /tmp/final-game.mjs
          node --check /tmp/final-game.mjs
          unzip -p /tmp/final-game.zip three.module.js > /tmp/final-three-module.js
          unzip -p /tmp/final-game.zip three.core.js > /tmp/final-three-core.js
          node --check /tmp/final-three-module.js
          node --check /tmp/final-three-core.js
          cp "$APK" GREEDLING-Start-Fixed.apk
          sha256sum GREEDLING-Start-Fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GREEDLING-start-fixed-apk
          path: GREEDLING-Start-Fixed.apk
          if-no-files-found: error
          retention-days: 7
