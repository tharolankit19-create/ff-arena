name: Build Snow Resource APK

on:
  push:
    branches:
      - snow-resource-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: snow-resource-apk
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp snow-resource-apk/app/build/outputs/apk/debug/app-debug.apk SnowResourceManager-playable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowResourceManager-playable-apk
          path: SnowResourceManager-playable.apk
          if-no-files-found: error
